<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">VR Garment Showroom main menu layout reference</title>
  <desc id="desc">Conceptual dark navy main menu with a blue showroom mark, welcome message, intro text, and Enter Showroom, Explore Products, and Exit buttons.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d1c"/><stop offset="1" stop-color="#101d39"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#2563eb" stop-opacity=".2"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2788ff"/><stop offset="1" stop-color="#165bd0"/></linearGradient>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <ellipse cx="720" cy="330" rx="610" ry="470" fill="url(#glow)"/>
  <path d="M0 744 Q360 665 720 744 T1440 728 V900 H0Z" fill="#07101f" opacity=".76"/>
  <path d="M0 744 Q360 665 720 744 T1440 728" fill="none" stroke="#27446e" stroke-opacity=".55" stroke-width="2"/>
  <g transform="translate(720 145)" fill="none" stroke="#56a3ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-48 8 0-26 48 8M-33 4v38h66V4M-12 42V16h24v26"/>
    <path d="M-57 56h114" stroke="#45d0c2"/>
  </g>
  <text x="720" y="245" fill="#7fbaff" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="5" text-anchor="middle">THREADHAVEN PRESENTS</text>
  <text x="720" y="323" fill="#f5f8ff" font-family="Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="1" text-anchor="middle">VR GARMENT SHOWROOM</text>
  <text x="720" y="380" fill="#dbe8fb" font-family="Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle">Welcome to the Virtual Showroom</text>
  <text x="720" y="435" fill="#aab9d2" font-family="Arial, sans-serif" font-size="19" text-anchor="middle">Explore garments in an immersive 3D space.</text>
  <text x="720" y="466" fill="#aab9d2" font-family="Arial, sans-serif" font-size="19" text-anchor="middle">Browse shirts, jackets, trousers and dresses.</text>
  <g font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    <rect x="500" y="530" width="440" height="66" rx="12" fill="url(#button)"/>
    <text x="720" y="572" fill="#ffffff">ENTER SHOWROOM</text>
    <rect x="500" y="614" width="440" height="66" rx="12" fill="#113b3d" stroke="#37c9a8" stroke-width="2"/>
    <text x="720" y="656" fill="#9af4dc">EXPLORE PRODUCTS</text>
    <rect x="500" y="698" width="440" height="56" rx="12" fill="#281b27" stroke="#d67886" stroke-width="1.5"/>
    <text x="720" y="734" fill="#f0a4ad">EXIT</text>
  </g>
  <text x="56" y="850" fill="#6d7d98" font-family="Arial, sans-serif" font-size="14">MSME MAJOR PROJECT · GARMENT INDUSTRY</text>
  <text x="1384" y="850" fill="#6d7d98" font-family="Arial, sans-serif" font-size="14" text-anchor="end">LAYOUT REFERENCE · NOT A RUNTIME SCREENSHOT</text>
</svg>
